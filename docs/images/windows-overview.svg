<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="850" viewBox="0 0 1200 850" role="img" aria-labelledby="title desc">
<title id="title">Capture Access Windows 界面示意</title><desc id="desc">新版 Windows 界面以 Capture Access 标题、蓝色主要按钮、窗口与日志分区和独立设置入口展示功能。所有名称、进程编号、日志均为虚构示例。</desc>
<defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#eaf2ff"/><stop offset="1" stop-color="#f4f8fd"/></linearGradient><filter id="shadow" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dy="12" stdDeviation="16" flood-color="#233957" flood-opacity=".13"/></filter></defs>
<rect width="1200" height="850" fill="url(#bg)"/>
<g font-family="'Microsoft YaHei UI','PingFang SC',sans-serif" fill="#1c2d45">
<text x="44" y="45" font-size="14" font-weight="700" letter-spacing="2" fill="#3768a3">WINDOWS · 界面示意</text><text x="1155" y="45" text-anchor="end" font-size="13" fill="#60748f">虚构演示数据</text>
<g filter="url(#shadow)"><rect x="40" y="68" width="1120" height="720" rx="9" fill="#f6f7f9"/><path d="M49 68h1102q9 0 9 9v33H40V77q0-9 9-9" fill="#fff"/></g>
<rect x="57" y="82" width="17" height="17" rx="3" fill="#2874ec"/><text x="86" y="96" font-size="13">Capture Access · 窗口截图保护助手</text><path d="M1045 91h11m36-5h11v11h-11z m39-1 11-11m-11 0 11 11" fill="none" stroke="#687b91" stroke-width="1.3"/>
<text x="72" y="163" font-size="31" font-weight="700">Capture Access</text><text x="72" y="194" font-size="15" fill="#687b91">选择窗口，处理截图保护。随后使用系统截图或你常用的截图工具。</text><rect x="1025" y="139" width="103" height="35" rx="5" fill="#fff" stroke="#cad6e5"/><text x="1076" y="162" text-anchor="middle" font-size="14">设置</text>
<text x="72" y="238" font-size="14">筛选窗口</text><rect x="154" y="215" width="974" height="36" rx="3" fill="#fff" stroke="#cbd7e6"/><text x="167" y="238" font-size="14" fill="#98a5b6">输入应用名称或窗口标题</text>
<rect x="72" y="269" width="1056" height="218" rx="5" fill="#fff" stroke="#d5dfeb"/><text x="88" y="292" font-size="13" font-weight="600" fill="#687b91">应用窗口 · 按 Ctrl 可多选</text><rect x="85" y="305" width="1030" height="33" rx="3" fill="#edf2f8"/>
<text x="98" y="327" font-size="13" font-weight="600">应用</text><text x="276" y="327" font-size="13" font-weight="600">PID / 架构</text><text x="416" y="327" font-size="13" font-weight="600">窗口标题</text><text x="834" y="327" font-size="13" font-weight="600">截图保护 / 状态</text>
<rect x="85" y="339" width="1030" height="43" fill="#e9f2ff"/><text x="98" y="366" font-size="14">Demo64.exe</text><text x="276" y="366" font-size="14">1000 / x64</text><text x="416" y="366" font-size="14">Capture Access Demo — 示例 A</text><rect x="834" y="347" width="148" height="28" rx="5" fill="#dbf2e8"/><text x="848" y="366" font-size="13" fill="#218161">已解除 · 当前 0</text>
<text x="98" y="410" font-size="14">Demo32.exe</text><text x="276" y="410" font-size="14">2000 / x86</text><text x="416" y="410" font-size="14">Capture Access Demo — 示例 B</text><text x="834" y="410" font-size="14" fill="#75849a">禁止捕获 (17)</text><line x1="85" y1="425" x2="1115" y2="425" stroke="#edf1f6"/>
<text x="98" y="454" font-size="14">Example.exe</text><text x="276" y="454" font-size="14">3000 / x64</text><text x="416" y="454" font-size="14">用于说明的普通窗口</text><text x="834" y="454" font-size="14" fill="#75849a">未保护 (0)</text>
<rect x="72" y="506" width="154" height="36" rx="5" fill="#0070f5"/><text x="149" y="530" text-anchor="middle" font-size="14" fill="#fff">解除选中窗口</text><rect x="238" y="506" width="138" height="36" rx="5" fill="#fff" stroke="#cad6e5"/><text x="307" y="530" text-anchor="middle" font-size="14">恢复原设置</text><rect x="388" y="506" width="116" height="36" rx="5" fill="#fff" stroke="#cad6e5"/><text x="446" y="530" text-anchor="middle" font-size="14">刷新窗口</text><rect x="516" y="506" width="154" height="36" rx="5" fill="#fff" stroke="#cad6e5"/><text x="593" y="530" text-anchor="middle" font-size="14">打开测试窗口</text><rect x="682" y="506" width="154" height="36" rx="5" fill="#fff" stroke="#cad6e5"/><text x="759" y="530" text-anchor="middle" font-size="14">以管理员重启</text>
<rect x="73" y="562" width="16" height="16" rx="3" fill="#2874ec"/><path d="m77 570 3 3 6-7" fill="none" stroke="#fff" stroke-width="2"/><text x="99" y="575" font-size="13">持续解除 · 每秒检查选中窗口，正常退出时恢复原设置</text>
<rect x="72" y="594" width="116" height="35" rx="5" fill="#fff" stroke="#cad6e5"/><text x="130" y="617" text-anchor="middle" font-size="14">检查更新</text><text x="1128" y="617" text-anchor="end" font-size="13" fill="#73849a">v0.8.0</text><text x="72" y="651" font-size="13" fill="#687b91">当前版本 v0.8.0 · 可检查 GitHub 更新</text>
<rect x="72" y="669" width="1056" height="76" rx="5" fill="#fff" stroke="#d5dfeb"/><text x="88" y="690" font-size="12" font-weight="600" fill="#687b91">操作日志</text><text x="88" y="718" font-size="13" fill="#687b91">示例记录：已处理选中的测试窗口，可使用截图工具检查画面。</text>
<text x="72" y="771" font-size="12" fill="#687b91">找到 3 个示例窗口 · 已记录 1 个窗口的原设置</text>
<text x="600" y="825" text-anchor="middle" font-size="13" fill="#73849a">界面示意：名称、进程编号和日志均为虚构，不包含真实应用或设备信息。</text>
</g></svg>
