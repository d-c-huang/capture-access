<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="430" viewBox="0 0 1200 430" role="img" aria-labelledby="title desc">
<title id="title">框选截图的三个步骤示意</title><desc id="desc">先框选，再拖动或缩放选区，最后确认并复制。所有画面都是虚构图形。</desc>
<rect width="1200" height="430" fill="#f4f7fb"/>
<g font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif" fill="#1c2d45">
<text x="44" y="42" font-size="14" font-weight="700" letter-spacing="2" fill="#3768a3">MACOS · 区域截图流程示意</text><text x="1156" y="42" text-anchor="end" font-size="13" fill="#73849a">松开鼠标后仍可调整</text>
<g><rect x="44" y="67" width="342" height="240" rx="14" fill="#fff" stroke="#dce4ef"/><rect x="60" y="83" width="310" height="208" rx="8" fill="#d9e8f5"/><circle cx="311" cy="125" r="20" fill="#fff4b8"/><path d="M60 251l69-82 76 83 53-51 112 61v29H60z" fill="#83aeb9"/><rect x="109" y="134" width="160" height="112" fill="#fff" fill-opacity=".15" stroke="#2874ec" stroke-width="3" stroke-dasharray="7 4"/><path d="M259 231v25l7-8 9 15 6-4-9-15 11-2z" fill="#fff" stroke="#254767" stroke-width="1.5"/></g>
<g><rect x="429" y="67" width="342" height="240" rx="14" fill="#fff" stroke="#dce4ef"/><rect x="445" y="83" width="310" height="208" rx="8" fill="#d9e8f5"/><circle cx="696" cy="125" r="20" fill="#fff4b8"/><path d="M445 251l69-82 76 83 53-51 112 61v29H445z" fill="#83aeb9"/><path d="M445 83h310v208H445z M488 116v145h214V116z" fill="#1b324f" fill-opacity=".25" fill-rule="evenodd"/><rect x="488" y="116" width="214" height="145" fill="none" stroke="#2874ec" stroke-width="3"/><g fill="#fff" stroke="#2874ec" stroke-width="2"><rect x="484" y="112" width="8" height="8"/><rect x="591" y="112" width="8" height="8"/><rect x="698" y="112" width="8" height="8"/><rect x="484" y="185" width="8" height="8"/><rect x="698" y="185" width="8" height="8"/><rect x="484" y="257" width="8" height="8"/><rect x="591" y="257" width="8" height="8"/><rect x="698" y="257" width="8" height="8"/></g><path d="M595 165v46m-23-23h46m-23-23-7 8m7-8 7 8m-7 38-7-8m7 8 7-8m-30-15 8-7m-8 7 8 7m38-7-8-7m8 7-8 7" fill="none" stroke="#fff" stroke-width="2.5"/></g>
<g><rect x="814" y="67" width="342" height="240" rx="14" fill="#fff" stroke="#dce4ef"/><rect x="830" y="83" width="310" height="208" rx="8" fill="#eaf2ff"/><rect x="856" y="105" width="258" height="119" rx="7" fill="#c2dfe9"/><circle cx="1071" cy="136" r="16" fill="#fff4b8"/><path d="M856 199l65-64 75 66 51-43 67 51v15H856z" fill="#76a5b0"/><rect x="899" y="242" width="172" height="34" rx="8" fill="#2874ec"/><text x="985" y="265" text-anchor="middle" font-size="15" font-weight="600" fill="#fff">确认并复制　↵</text></g>
<circle cx="65" cy="340" r="16" fill="#2874ec"/><text x="65" y="345" font-size="14" fill="#fff" text-anchor="middle">1</text><text x="92" y="346" font-size="18" font-weight="700">拖动框选</text><text x="44" y="377" font-size="14" fill="#687b91">选择想保留的区域。</text>
<circle cx="450" cy="340" r="16" fill="#2874ec"/><text x="450" y="345" font-size="14" fill="#fff" text-anchor="middle">2</text><text x="477" y="346" font-size="18" font-weight="700">移动 / 调整大小</text><text x="429" y="377" font-size="14" fill="#687b91">拖动内部移动，拖动边角缩放。</text>
<circle cx="835" cy="340" r="16" fill="#2874ec"/><text x="835" y="345" font-size="14" fill="#fff" text-anchor="middle">3</text><text x="862" y="346" font-size="18" font-weight="700">确认后复制</text><text x="814" y="377" font-size="14" fill="#687b91">按回车完成；Esc 取消本次截图。</text>
<text x="1156" y="413" text-anchor="end" font-size="11" fill="#8a99ad">虚构图形示意 · 非实际截图</text>
</g></svg>
