<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="800" viewBox="0 0 1200 800" role="img" aria-labelledby="title desc">
<title id="title">Capture Access macOS 界面示意</title><desc id="desc">使用虚构的风景卡片演示普通截图、特殊截图、预览和本机历史。不是实际用户截图。</desc>
<defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#ecf3ff"/><stop offset="1" stop-color="#f7fbff"/></linearGradient><linearGradient id="sky" x2="1" y2="1"><stop stop-color="#d8eeff"/><stop offset="1" stop-color="#a7d7ee"/></linearGradient><filter id="shadow" x="-10%" y="-10%" width="120%" height="130%"><feDropShadow dy="12" stdDeviation="16" flood-color="#233957" flood-opacity=".13"/></filter></defs>
<rect width="1200" height="800" fill="url(#bg)"/>
<g font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Microsoft YaHei',sans-serif" fill="#1c2d45">
<text x="44" y="45" font-size="14" font-weight="700" letter-spacing="2" fill="#3768a3">MACOS · 界面示意</text><text x="1155" y="45" text-anchor="end" font-size="13" fill="#60748f">虚构演示数据</text>
<g filter="url(#shadow)"><rect x="40" y="68" width="1120" height="672" rx="18" fill="#fff"/><path d="M58 68h1084q18 0 18 18v30H40V86q0-18 18-18" fill="#f3f6fa"/></g>
<circle cx="66" cy="92" r="6" fill="#ff6761"/><circle cx="88" cy="92" r="6" fill="#ffbd44"/><circle cx="110" cy="92" r="6" fill="#00c84a"/><text x="600" y="98" text-anchor="middle" font-size="14" fill="#6c7b8e">Capture Access · 窗口截图</text>
<text x="72" y="161" font-size="30" font-weight="700">Capture Access</text><text x="72" y="190" font-size="15" fill="#687b91">框选、调整、确认并复制。截图随时可以另存 PNG。</text>
<rect x="970" y="139" width="70" height="34" rx="8" fill="#f3f6fb" stroke="#dce4ef"/><text x="1005" y="161" text-anchor="middle" font-size="14">关于</text><rect x="1052" y="139" width="76" height="34" rx="8" fill="#f3f6fb" stroke="#dce4ef"/><text x="1090" y="161" text-anchor="middle" font-size="14">设置</text>
<rect x="72" y="215" width="164" height="37" rx="8" fill="#2874ec"/><text x="154" y="239" text-anchor="middle" font-size="15" fill="#fff" font-weight="600">普通区域截图</text><text x="250" y="239" font-size="15" fill="#687b91">⌃⌥A</text>
<rect x="838" y="215" width="168" height="37" rx="8" fill="#fff" stroke="#dce4ef"/><text x="922" y="239" text-anchor="middle" font-size="14">选择窗口并截图</text><rect x="1018" y="215" width="110" height="37" rx="8" fill="#fff" stroke="#dce4ef"/><text x="1073" y="239" text-anchor="middle" font-size="14">再次截图</text>
<rect x="72" y="265" width="184" height="34" rx="8" fill="#fff" stroke="#dce4ef"/><text x="164" y="287" text-anchor="middle" font-size="14">开启特殊应用截图…</text><text x="270" y="287" font-size="14" fill="#687b91">⌃⌥S　目标：示例应用</text><text x="72" y="322" font-size="13" fill="#73849a">用于应用限制截图的情况；兼容性取决于目标应用。</text>
<rect x="72" y="342" width="764" height="278" rx="12" fill="#f2f5f9"/><rect x="92" y="362" width="724" height="238" rx="8" fill="url(#sky)"/>
<circle cx="697" cy="411" r="24" fill="#fff5bd"/><path d="M92 553l135-120 109 100 113-137 142 157 117-96 108 96v47H92z" fill="#80b5bd"/><path d="M92 571l178-99 142 101 149-72 112 70 143-60v89H92z" fill="#497d88"/>
<rect x="119" y="386" width="270" height="114" rx="10" fill="#fff" opacity=".94"/><text x="143" y="420" font-size="12" font-weight="700" letter-spacing="2" fill="#558296">CAPTURE ACCESS DEMO</text><text x="143" y="454" font-size="25" font-weight="700">留住这一刻</text><text x="143" y="480" font-size="13" fill="#677d91">本图为纯虚构示例，无个人信息。</text>
<rect x="856" y="342" width="272" height="330" rx="12" fill="#f8fafc"/><text x="876" y="372" font-size="17" font-weight="700">截图历史</text><text x="960" y="372" font-size="13" fill="#73849a">2</text><text x="1099" y="372" text-anchor="end" font-size="13" fill="#3768a3">清空</text><text x="876" y="397" font-size="12" fill="#73849a">保存于本机，可在设置中关闭。</text>
<rect x="869" y="414" width="246" height="84" rx="9" fill="#eaf2ff"/><rect x="881" y="427" width="76" height="57" rx="5" fill="#b5dcea"/><path d="M881 468l23-25 25 25 28-13v29h-76z" fill="#6195a0"/><text x="969" y="447" font-size="13" font-weight="600">风景示例</text><text x="969" y="471" font-size="12" fill="#73849a">800 × 480</text>
<rect x="881" y="516" width="76" height="57" rx="5" fill="#dce8f8"/><rect x="892" y="527" width="54" height="5" rx="2" fill="#a5bad8"/><rect x="892" y="540" width="40" height="5" rx="2" fill="#a5bad8"/><rect x="892" y="553" width="49" height="5" rx="2" fill="#a5bad8"/><text x="969" y="536" font-size="13">文字示例</text><text x="969" y="560" font-size="12" fill="#73849a">640 × 360</text>
<text x="72" y="644" font-size="12" fill="#73849a">800 × 480 像素 · 示例图片</text><rect x="72" y="658" width="119" height="34" rx="8" fill="#fff" stroke="#dce4ef"/><text x="131" y="680" text-anchor="middle" font-size="14">另存 PNG…</text><rect x="203" y="658" width="116" height="34" rx="8" fill="#fff" stroke="#dce4ef"/><text x="261" y="680" text-anchor="middle" font-size="14">复制图片</text><text x="824" y="680" text-anchor="end" font-size="13" fill="#687b91">清除预览</text>
<text x="72" y="721" font-size="12" fill="#687b91">关闭窗口后仍驻留右上角菜单栏。回车确认选区，Esc 取消。</text>
<text x="600" y="775" text-anchor="middle" font-size="13" fill="#73849a">界面与图片均为绘制示意，展示功能位置，不含真实桌面或截图内容。</text>
</g></svg>
